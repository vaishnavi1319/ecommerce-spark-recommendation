# ==============================================================================
# Nginx Reverse Proxy Configuration for SparkRec Application
# Target Location: /etc/nginx/sites-available/sparkrec.conf
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    # Maximum upload size for large dataset CSV uploads
    client_max_body_size 100M;

    # Gzip Compression for high-throughput responses (analytics, recs JSON)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        text/xml
        application/xml;

    # Proxy to Flask/Gunicorn backend
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;

        # Standard headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Spark training pipeline can take 30-180 seconds — prevent 504 Gateway Timeout
        proxy_connect_timeout 300s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Buffering settings
        proxy_buffering on;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
}
